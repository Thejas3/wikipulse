[project]
name = "wikipulse"
version = "0.1.0"
description = "Live Wikipedia edit stream and trending articles dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wikipulse*"]

[tool.setuptools.package-data]
wikipulse = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# streaming/tests need Spark and Java; they run in the streaming image (`make test-streaming`).
testpaths = ["tests", "producer/tests"]
