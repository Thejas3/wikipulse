name: wikipulse

x-kafka-image: &kafka-image apache/kafka:3.9.1

x-streaming: &streaming
  build:
    context: .
    dockerfile: streaming/Dockerfile
  image: wikipulse-streaming:dev
  environment: &streaming-env
    KAFKA_BOOTSTRAP: kafka:9092
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    SPARK_DRIVER_MEMORY: 1g

services:
  kafka:
    image: *kafka-image
    restart: unless-stopped
    ports:
      - "29092:29092"  # for tools on the host (audit.py, the producer outside Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  # KRaft: no ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days of replayable history
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g  # PRD resource budget
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in wiki.recentchange.raw wiki.recentchange.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions "$${KAFKA_PARTITIONS:-3}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "9108:9108"  # Prometheus metrics
    volumes:
      - producer-state:/state
    mem_limit: 256m

  # S3-compatible object store for the Delta lake (stands in for MinIO; see docs/decisions/0002).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "wikipulse",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"  # S3 API, for host tools (DuckDB in Milestone 4)
    volumes:
      - lake-data:/data
    mem_limit: 1536m  # 1 GB was OOM-killed during the daily OPTIMIZE (bulk reads + writes)
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Bronze, Silver and Gold as three queries in one Spark app (streaming/pipeline.py).
  streaming:
    <<: *streaming
    command: ["python", "pipeline.py"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *streaming-env
      SPARK_DRIVER_MEMORY: 2g
      # Bound the JVM's off-heap pools so heap + off-heap + the Python driver stay under the
      # container limit (at 3 GB it was OOM-killed twice during the Silver rebuild).
      SPARK_DRIVER_JAVA_OPTS: ${SPARK_DRIVER_JAVA_OPTS:--XX:MaxDirectMemorySize=512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m}
      METRICS_PORT: 9109
    ports:
      - "127.0.0.1:9109:9109"  # Prometheus metrics
    mem_limit: 3584m  # PRD §9 budgets 3 GB for Spark; +512 MB for the Python driver and S3 buffers

  # ---- Orchestration (PRD §8): Airflow schedules dbt, exports, maintenance and quality ----
  airflow-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  airflow:
    build: ./airflow
    image: wikipulse-airflow:dev
    restart: unless-stopped
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__WEBSERVER__WORKERS: "1"  # memory: one gunicorn worker is plenty for one user
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" --role Admin \
           --firstname Wiki --lastname Pulse --email admin@localhost 2>/dev/null || true) &&
        (airflow scheduler &) &&
        exec airflow webserver --port 8080
    ports:
      - "127.0.0.1:8080:8080"  # Airflow UI (admin / AIRFLOW_ADMIN_PASSWORD from .env)
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/wikipulse/dbt
      - ./quality:/opt/wikipulse/quality
      - ./dashboard:/opt/wikipulse/dashboard
      - ./warehouse:/opt/wikipulse/warehouse
    mem_limit: 2g  # tasks (dbt, GX, the DuckDB audit) run inside this container (LocalExecutor)

  # ---- Monitoring (PRD §8): Prometheus scrapes the producer and the Spark app ----
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"  # Grafana (admin / GRAFANA_ADMIN_PASSWORD from .env)
    mem_limit: 256m

  # One-off tools: `docker compose run --rm spark-tools pytest` or `... python audit_lake.py`.
  # Mounts the working copy so tests and audits use the current code without a rebuild.
  spark-tools:
    <<: *streaming
    profiles: ["tools"]
    command: ["pytest", "-q", "tests"]
    volumes:
      - ./streaming:/app
    environment:
      <<: *streaming-env
      SPARK_DRIVER_MEMORY: 1536m
      SPARK_DRIVER_JAVA_OPTS: -XX:MaxDirectMemorySize=384m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m
    mem_limit: 2560m  # audits scan all of Bronze; 1.5 GB was OOM-killed

volumes:
  kafka-data:
  producer-state:
  lake-data:
  airflow-db:
  prometheus-data:
  grafana-data:
