name: wikipulse

x-kafka-image: &kafka-image apache/kafka:3.9.1

x-streaming: &streaming
  build:
    context: .
    dockerfile: streaming/Dockerfile
  image: wikipulse-streaming:dev
  environment: &streaming-env
    KAFKA_BOOTSTRAP: kafka:9092
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    SPARK_DRIVER_MEMORY: 1g

services:
  kafka:
    image: *kafka-image
    restart: unless-stopped
    ports:
      - "29092:29092"  # for tools on the host (audit.py, the producer outside Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  # KRaft: no ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days of replayable history
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g  # PRD resource budget
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: *kafka-image
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in wiki.recentchange.raw wiki.recentchange.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions "$${KAFKA_PARTITIONS:-3}" --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe
    environment:
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    restart: "no"

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "9108:9108"  # Prometheus metrics
    volumes:
      - producer-state:/state
    mem_limit: 256m

  # S3-compatible object store for the Delta lake (stands in for MinIO; see docs/decisions/0002).
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "wikipulse",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=64
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8333:8333"  # S3 API, for host tools (DuckDB in Milestone 4)
    volumes:
      - lake-data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  bronze:
    <<: *streaming
    command: ["python", "bronze_job.py"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    mem_limit: 1536m

  silver:
    <<: *streaming
    command: ["python", "silver_job.py"]
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_healthy
      bronze:
        condition: service_started
    mem_limit: 1536m

  # One-off tools: `docker compose run --rm spark-tools pytest` or `... python audit_lake.py`.
  # Mounts the working copy so tests and audits use the current code without a rebuild.
  spark-tools:
    <<: *streaming
    profiles: ["tools"]
    command: ["pytest", "-q", "tests"]
    volumes:
      - ./streaming:/app
    mem_limit: 1536m

volumes:
  kafka-data:
  producer-state:
  lake-data:
